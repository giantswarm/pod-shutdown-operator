{{- if not .Values.api.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tokenSecret" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "labels.common" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ required "Set api.token, or set api.existingSecret to the name of a Secret with the key token" .Values.api.token | quote }}
{{- end }}
