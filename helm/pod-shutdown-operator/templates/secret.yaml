{{- if not .Values.api.existingSecret }}
{{- $token := .Values.api.token }}
{{- if not $token }}
{{- /* An upgrade keeps the token that the chart generated before. */}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (include "tokenSecret" .) }}
{{- $token = dig "data" "token" "" $existing | b64dec }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tokenSecret" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "labels.common" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ $token | default (randBytes 32) | quote }}
{{- end }}
