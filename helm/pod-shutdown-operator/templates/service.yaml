apiVersion: v1
kind: Service
metadata:
  name: {{ include "name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "labels.common" . | nindent 4 }}
spec:
  # The callers are outside the cluster, and the cluster has no load balancer.
  type: NodePort
  selector:
    {{- include "labels.selector" . | nindent 4 }}
  ports:
    - name: api
      port: 8082
      targetPort: api
      nodePort: {{ .Values.api.nodePort }}
