---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: shutdownplans.shutdown.giantswarm.io
spec:
  group: shutdown.giantswarm.io
  names:
    kind: ShutdownPlan
    listKind: ShutdownPlanList
    plural: shutdownplans
    singular: shutdownplan
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.result
      name: Result
      type: string
    - jsonPath: .status.computedAt
      name: Computed
      type: date
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ShutdownPlan is a dry run of a shutdown. The operator plans for
          the whole cluster and changes nothing.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          status:
            description: ShutdownPlanStatus is the snapshot of the plan. The operator
              writes it once.
            properties:
              computedAt:
                description: ComputedAt is the time of the snapshot.
                format: date-time
                type: string
              findings:
                items:
                  description: Finding is a problem in the plan.
                  properties:
                    applications:
                      description: Applications are the applications (namespace/name)
                        that the finding is about.
                      items:
                        type: string
                      type: array
                      x-kubernetes-list-type: atomic
                    fallback:
                      description: Fallback is the rule that a real shutdown uses.
                      type: string
                    message:
                      type: string
                    reason:
                      description: Reason is the type of the finding, for example
                        Cycle.
                      type: string
                    severity:
                      description: Severity is the severity of a finding.
                      enum:
                      - Error
                      - Warning
                      type: string
                  required:
                  - fallback
                  - message
                  - reason
                  - severity
                  type: object
                type: array
                x-kubernetes-list-type: atomic
              groups:
                items:
                  description: 'PlannedGroup is a dependency group: a set of applications
                    that dependsOn links together.'
                  properties:
                    available:
                      description: Available is the time from the start of the group
                        to the end of the budget minus the safety margin.
                      type: string
                    longestChain:
                      description: LongestChain is the gracePeriod sum of the longest
                        chain in the group, before the shrink.
                      type: string
                    tiers:
                      items:
                        description: |-
                          PlannedTier is the set of applications at one position of a dependency group.
                          Tier 1 stops first.
                        properties:
                          applications:
                            items:
                              description: PlannedApplication is an application and
                                its time plan.
                              properties:
                                deadline:
                                  description: Deadline is the latest time of the
                                    forced stop, as the time after the start of the
                                    shutdown.
                                  type: string
                                gracePeriod:
                                  description: GracePeriod is the configured gracePeriod.
                                  type: string
                                name:
                                  type: string
                                namespace:
                                  type: string
                                shrunkGracePeriod:
                                  description: ShrunkGracePeriod is the gracePeriod
                                    after the shrink. It is equal to GracePeriod when
                                    the group fits.
                                  type: string
                                workloads:
                                  items:
                                    description: PlannedWorkload is a workload and
                                      the action that a real shutdown does on it.
                                    properties:
                                      action:
                                        description: Action is the action of a real
                                          shutdown, for example ScaleToZero.
                                        type: string
                                      kind:
                                        description: WorkloadKind is the kind of a
                                          workload that a ManagedApplication lists.
                                        enum:
                                        - Deployment
                                        - StatefulSet
                                        - VirtualMachine
                                        - CronJob
                                        type: string
                                      name:
                                        type: string
                                    required:
                                    - action
                                    - kind
                                    - name
                                    type: object
                                  type: array
                                  x-kubernetes-list-type: atomic
                              required:
                              - deadline
                              - gracePeriod
                              - name
                              - namespace
                              - shrunkGracePeriod
                              type: object
                            type: array
                            x-kubernetes-list-type: atomic
                          tier:
                            format: int32
                            type: integer
                        required:
                        - applications
                        - tier
                        type: object
                      type: array
                      x-kubernetes-list-type: atomic
                  required:
                  - available
                  - longestChain
                  - tiers
                  type: object
                type: array
                x-kubernetes-list-type: atomic
              report:
                description: Report is the plan as text.
                type: string
              result:
                description: PlanResult is the worst severity of the findings of a
                  ShutdownPlan.
                enum:
                - OK
                - Warnings
                - Errors
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
