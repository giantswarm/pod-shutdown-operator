---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pod-shutdown-operator
rules:
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - apps
  resources:
  - deployments
  - statefulsets
  verbs:
  - get
  - list
  - patch
  - watch
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - shutdown.giantswarm.io
  resources:
  - managedapplications
  - shutdownrequests
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - shutdown.giantswarm.io
  resources:
  - shutdownrequests/status
  verbs:
  - get
  - patch
  - update
