minimum_pre_commit_version: '2.17'
default_install_hook_types: [pre-commit, commit-msg]
# Protobuf-generated code (protoc, buf: *_pb.ts, *_pb.js, *_pb2.py,
# *_pb2_grpc.py, *.pb.go, *_grpc.pb.go) belongs to its generator: a hook that
# rewrote it (end-of-file-fixer, go-imports, ruff --fix) would be undone by
# the next generation, so no hook reads it.
exclude: "(_pb2?|\\.pb)(_grpc)?\\.[^/]+$"
repos:
  # base hooks
  #
  # helm/<chart>/charts/ holds vendored upstream subcharts (vendir-synced).
  # Those files are not repo-authored: the auto-fixing hooks would rewrite
  # them on every vendir bump and the next vendir sync would revert the fix,
  # so the whitespace/shebang/private-key hooks skip the vendored subtree.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
        exclude: "^helm/[^/]+/charts/.*"
      - id: detect-private-key
        # Upstream charts document key formats with placeholder PEM headers
        # (redis-ha's restore.ssh.key example) that the hook cannot tell from
        # a key; gitleaks stays the scanner of record for the vendored subtree.
        exclude: "^helm/[^/]+/charts/.*"
      - id: end-of-file-fixer
        exclude: "(.*testdata/.*|^\\.yarn/.*|^helm/[^/]+/charts/.*|.*.patch)"
      - id: mixed-line-ending
        exclude: "(^helm/[^/]+/charts/.*|.*.patch)"
      - id: trailing-whitespace
        exclude: "(.*testdata/.*|^\\.yarn/.*|^helm/[^/]+/charts/.*|.*.patch)"

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [--strict]

  # Go hooks
  - repo: https://github.com/dnephin/pre-commit-golang
    rev: v0.5.1
    hooks:
      - id: go-fmt
      - id: go-mod-tidy
      - id: golangci-lint
        args:
          # No --timeout: golangci-lint v2 has none by default and a flag would
          # override a repo's `run.timeout` in .golangci.yml, its place to set one.
          # List all issues found
          - --max-same-issues=0
          - --max-issues-per-linter=0
      - id: go-imports
        args: [ -local, github.com/giantswarm/pod-shutdown-operator ]

  # Helm chart schema: verify that helm/pod-shutdown-operator/values.schema.json is up to date.
  # The hook installs the pinned generator, writes the schema to a temporary file, and compares the two files.
  # To update the schema, run the same generator with -o helm/pod-shutdown-operator/values.schema.json.
  - repo: local
    hooks:
      - id: helm-schema-pod-shutdown-operator
        name: "verify helm/pod-shutdown-operator/values.schema.json is up to date"
        language: golang
        additional_dependencies: ['github.com/losisin/helm-values-schema-json/v2@v2.6.0']
        files: ^helm/pod-shutdown-operator/(values\.yaml|\.schema\.yaml|values\.schema\.json)$
        pass_filenames: false
        require_serial: true
        entry: sh -c
        args:
          - |
            set -e
            tmp=$(mktemp)
            trap 'rm -f "$tmp"' EXIT
            helm-values-schema-json --config helm/pod-shutdown-operator/.schema.yaml -o "$tmp"
            if ! diff -u helm/pod-shutdown-operator/values.schema.json "$tmp"; then
              echo "helm/pod-shutdown-operator/values.schema.json is out of date -- run helm-values-schema-json and commit the result" >&2
              exit 1
            fi
  # helm-docs finds every chart below helm/, the vendored subcharts under
  # helm/<chart>/charts/ included; --chart-to-generate limits the README it
  # writes to the repo's own charts, so the vendored subtree stays untouched
  # like it does for the base hooks above.
  - repo: https://github.com/norwoodj/helm-docs
    rev: "v1.14.2"
    hooks:
      - id: helm-docs
        args:
          - --chart-search-root=helm
          - --chart-to-generate=helm/pod-shutdown-operator
          - --sort-values-order=file
