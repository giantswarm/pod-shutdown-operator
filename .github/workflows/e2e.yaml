name: e2e

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go environment
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0
      - name: Run the e2e tests in kind
        run: make test-e2e
      - name: Show the operator logs
        if: failure()
        run: |
          kubectl --kubeconfig bin/e2e/kubeconfig --namespace pod-shutdown-operator \
            logs --selector app.kubernetes.io/name=pod-shutdown-operator --prefix --tail -1
